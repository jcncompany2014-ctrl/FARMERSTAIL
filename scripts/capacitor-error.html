<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파머스테일</title>
<!--
  앱(Capacitor)이 서버를 못 불러올 때 보여 주는 화면 — capacitor.config.ts server.errorPath.
  2026-09-26 출시 전 점검 7차: 예전엔 오프라인(지하철·엘리베이터)에서 앱을 켜면 베이지 빈 화면만
  남고 문구·새로고침이 없어 앱을 강제 종료해야 했다(iOS WKWebView 엔 서비스워커 /offline 도 없다).
  네트워크 없이 떠야 하므로 외부 폰트·이미지·스크립트 없이 이 파일 하나로 끝낸다.
  안드로이드에선 이 페이지가 Capacitor 플러그인을 못 쓴다 — 일반 링크만 쓴다.
-->
<style>
  html, body { margin: 0; height: 100%; background: #F5F0E6; color: #16140F;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 32px 24px; box-sizing: border-box; text-align: center; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  p { margin: 12px 0 28px; font-size: 16px; line-height: 1.55; color: #3A342A; word-break: keep-all; }
  a { display: inline-block; padding: 14px 28px; border-radius: 999px; background: #16140F;
    color: #F5F0E6; font-size: 16px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>인터넷 연결을 확인해 주세요</h1>
  <p>지금은 파머스테일에 연결할 수 없어요.<br>연결되면 자동으로 다시 불러올게요.</p>
  <a href="https://www.farmerstail.kr/">다시 시도</a>
</main>
<script>
  // 연결이 돌아오면 스스로 다시 불러온다.
  window.addEventListener('online', function () { location.href = 'https://www.farmerstail.kr/' })
</script>
</body>
</html>
